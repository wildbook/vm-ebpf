cargo-features = ["profile-rustflags"]

[workspace]
resolver = "2"
members = ["bin/*", "lib/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
btf       = { path = "lib/btf" }
constelf  = { path = "lib/constelf" }
ebpf-asm  = { path = "lib/ebpf-asm" }
rvm-core  = { path = "lib/rvm-core", default-features = false }
hashbrown = { version = "0.17.1", default-features = false, features = ["default-hasher"] }
bytemuck  = { version = "1.25", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
codegen-units = 1
opt-level = "s"
debug = "full"
lto = "fat"
panic = "abort"

# The interpreter is generic and inlines into rvm (`Program::call`), so rvm alone
# needs full optimization; `s` there costs guest code 17-24%.
[profile.release.package.rvm]
opt-level = 3

# Smallest binary for embedding rvm in a host: no panic locations and names-only `Debug`.
[profile.embedded]
inherits = "release"
debug = false
strip = true
rustflags = [
    "-Zlocation-detail=none",
    "-Zfmt-debug=shallow",
]

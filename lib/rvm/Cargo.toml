[package]
name = "rvm"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Embeddable eBPF runtime with CO-RE support"

[lints]
workspace = true

[dependencies]
rvm-core  = { workspace = true }
constelf  = { workspace = true, optional = true }
btf       = { workspace = true, optional = true }
hashbrown = { workspace = true }
foldhash  = { version = "0.2.0", default-features = false }
bytemuck  = { workspace = true, optional = true }

# These comments are the feature reference; the crate docs link here.
[features]
default = ["link", "fuel", "maps"]
# ELF parsing, BTF, CO-RE and the linker: `Module`, `HostTypes`, `Vm::with_types`, `Vm::prepare_elf`,
# `Vm::prepare_modules`, `Vm::load_elf` and `Vm::load_modules`. Without it, rvm loads prepared images only.
link = ["dep:constelf", "dep:btf"]
# Enforces `VmConfig::instruction_limit`. Without it, the interpreter doesn't count instructions, and a non-zero limit
# fails with `VmError::FuelNotEnabled`. A call without a limit costs the same with and without it.
fuel = ["rvm-core/fuel"]
# Guest maps: the map helpers, `Program::map`, `Vm::share_map`, and `Pod` for typed keys and values. Without it, an
# image that declares maps fails to load with `LinkError::InvalidMap`.
maps = ["dep:bytemuck"]
# Guest hash maps use a fixed hash seed, so builds compared in benchmarks probe the same way.
fixed-hash-seed = []

[dev-dependencies]
btf       = { workspace = true }
bytemuck  = { workspace = true, features = ["derive"] }
constelf  = { workspace = true }
criterion = "0.7"
ebpf-asm  = { workspace = true }

[[test]]
name = "integration"
required-features = ["link", "maps"]

[[bench]]
name = "exec"
harness = false
required-features = ["link", "maps"]

[[bench]]
name = "workloads"
harness = false
required-features = ["link", "maps"]

[[example]]
name = "core_reloc"
required-features = ["link"]

[[example]]
name = "hot_reload"
required-features = ["link", "maps"]

# `test = true` runs the examples' layout checks under `cargo test`
[[example]]
name = "modding"
required-features = ["link", "maps"]
test = true

[[example]]
name = "msgpack_logs"
required-features = ["link", "maps"]
test = true

[package]
name = "rvm"
version = "0.1.0"
edition = "2021"
description = "Embeddable eBPF runtime with CO-RE support"
license = "MIT OR Apache-2.0"

[dependencies]
rvm-core = { path = "../rvm-core", default-features = false }
constelf = { path = "../constelf", optional = true }
btf = { path = "../btf", optional = true }
hashbrown = { version = "0.17.1", default-features = false, features = ["default-hasher"] }
foldhash = { version = "0.2.0", default-features = false }

[features]
default = ["link", "fuel"]
# ELF parsing, CO-RE and the linker. Without it, rvm loads prepared images only.
link = ["dep:constelf", "dep:btf"]
# `VmConfig::instruction_limit`. Without it, the interpreter doesn't count instructions.
fuel = ["rvm-core/fuel"]
# Guest hash maps use a fixed hash seed (reproducible benchmarks and PGO profiles).
fixed-hash-seed = []

[dev-dependencies]
criterion = "0.7"
ebpf-asm = { path = "../ebpf-asm" }

[[bench]]
name = "exec"
harness = false
required-features = ["link"]

[[bench]]
name = "workloads"
harness = false
required-features = ["link"]

[[example]]
name = "core_reloc"
required-features = ["link"]

[[example]]
name = "modding"
required-features = ["link"]

[[example]]
name = "msgpack_logs"
required-features = ["link"]

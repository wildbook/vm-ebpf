[package]
name = "rvm"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Embeddable eBPF runtime with CO-RE support"

[lints]
workspace = true

[dependencies]
rvm-core  = { workspace = true }
constelf  = { workspace = true, optional = true }
btf       = { workspace = true, optional = true }
hashbrown = { workspace = true }
foldhash  = { version = "0.2.0", default-features = false }

[features]
default = ["link", "fuel"]
# ELF parsing, CO-RE and the linker. Without it, rvm loads prepared images only.
link = ["dep:constelf", "dep:btf"]
# `VmConfig::instruction_limit`. Without it, the interpreter doesn't count instructions.
fuel = ["rvm-core/fuel"]
# Guest hash maps use a fixed hash seed, so builds compared in benchmarks probe the same way.
fixed-hash-seed = []

[dev-dependencies]
criterion = "0.7"
ebpf-asm  = { workspace = true }

[[test]]
name = "integration"
required-features = ["link"]

[[test]]
name = "mutations"
required-features = ["link"]

[[bench]]
name = "exec"
harness = false
required-features = ["link"]

[[bench]]
name = "workloads"
harness = false
required-features = ["link"]

[[example]]
name = "core_reloc"
required-features = ["link"]

[[example]]
name = "modding"
required-features = ["link"]

[[example]]
name = "msgpack_logs"
required-features = ["link"]

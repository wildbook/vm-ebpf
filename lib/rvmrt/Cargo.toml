[package]
name = "rvmrt"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "rvm as a C library that runs prepared images"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
default = ["fuel"]
# Limits each call to `rvm::DEFAULT_INSTRUCTION_LIMIT` instructions. Without it calls have no limit.
fuel = ["rvm/fuel"]
# General native FFI marshalling: structs by value/return, float/double returns, variadics.
ffi = ["rvm/ffi"]
# Synchronous native-to-guest callbacks.
callbacks = ["ffi", "rvm/callbacks"]

[dependencies]
rvm = { path = "../rvm", default-features = false }

[dev-dependencies]
# tests/stack_args.rs prepares its image with the linker
rvm = { path = "../rvm", default-features = false, features = ["link"] }
